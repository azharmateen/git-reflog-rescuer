[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-reflog-rescuer"
version = "0.1.0"
description = "Beautiful TUI that turns scary git reflog into visual timeline for recovering lost commits"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "git-reflog-rescuer contributors"}]
keywords = ["git", "reflog", "tui", "recovery", "undo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.0",
    "textual>=0.47",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
git-reflog-rescuer = "git_reflog_rescuer.cli:main"

[tool.setuptools.packages.find]
include = ["git_reflog_rescuer*"]
